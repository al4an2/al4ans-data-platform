# Trino catalog "lakehouse" — THE key wiring of the whole stack:
#   Trino -> (Iceberg REST protocol) -> Nessie -> table metadata
#   Trino -> (S3 protocol)           -> MinIO  -> Parquet data files

# Docs: https://trino.io/docs/current/connector/iceberg.html
#       https://trino.io/docs/current/object-storage/file-system-s3.html

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
