[project]
name = "al4ans-data-platform"
version = "0.1.0"
description = "Lakehouse platform: S3 (MinIO) + Spark + Parquet + Iceberg + Trino, with Python platform services on top"
readme = "README.md"
authors = [{ name = "Aleksandr Ignatev", email = "al4an2@gmail.com" }]
# Python 3.12: PySpark 3.5 supports it in practice since 3.5.1 (officially <=3.11);
# if we hit Spark incompatibilities, the plan is to move to Spark 4.x, not downgrade Python.
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "N",   # pep8-naming
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
pretty = true

[[tool.mypy.overrides]]
# PySpark ships incomplete type stubs; don't let it poison strict mode.
module = ["pyspark.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs local infra (MinIO/Nessie/Trino/Spark) running",
]
